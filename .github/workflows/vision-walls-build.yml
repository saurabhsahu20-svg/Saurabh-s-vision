name: Build Vision Walls Android APK
on:
  push:
    paths:
      - 'vision-walls/app/**'
      - 'vision-walls/build.gradle'
      - 'vision-walls/settings.gradle'
      - 'vision-walls/gradle.properties'
      - '.github/workflows/vision-walls-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-walls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload free APK
        uses: actions/upload-artifact@v4
        with:
          name: VISION_DIGITAL_WALLS_2_0_APK
          path: vision-walls/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Publish public APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p download
          cp app/build/outputs/apk/debug/app-debug.apk download/Vision_Digital_Walls_v2.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add download/Vision_Walls_Free_v1.1.apk
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Vision Digital Walls APK v2.0 [skip ci]'
          git push
