name: Build Vision Walls Android APK
on:
  push:
    paths:
      - 'vision-walls/**'
      - '.github/workflows/vision-walls-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-walls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload free APK
        uses: actions/upload-artifact@v4
        with:
          name: Vision-Walls-Free-APK
          path: vision-walls/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
