name: SAUNE VIBE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAUNE_VIBE_v1.0.1_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download in GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Saune_Vibe_v1.0.1.apk
          test -s Saune_Vibe_v1.0.1.apk
          if gh release view v1.0.1 > /dev/null 2>&1; then
            gh release upload v1.0.1 Saune_Vibe_v1.0.1.apk --clobber
          else
            gh release create v1.0.1 Saune_Vibe_v1.0.1.apk \
              --title "Saune Vibe 1.0.1 - Android APK" \
              --notes "Download the debug-signed Android APK below (Android 7.0+). The Saune Vibe branding includes the supplied neon headphone logo. Search requires your YouTube Data API key in Settings. This is a test build, not a Play Store release." \
              --target "$GITHUB_SHA"
          fi
