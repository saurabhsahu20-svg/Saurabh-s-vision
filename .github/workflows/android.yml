name: SAUNE VIBE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signing, archive and package before publishing
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 24 "$APK" | tee apk-signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-package-info.txt
          grep -q "name='com.saunevibe.fresh'" apk-package-info.txt
          grep -q "versionCode='7'" apk-package-info.txt
          grep -q "versionName='1.1.1'" apk-package-info.txt
          grep -q "sdkVersion:'24'" apk-package-info.txt
          grep -q "application-label:'Saune Vibe'" apk-package-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Allow hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test fresh APK installation and launch on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.saunevibe.fresh | grep '^package:'
            adb shell am start -W -n com.saunevibe.fresh/com.musicvibe.app.MainActivity | tee android-launch-test.txt
            sleep 8
            adb shell pidof com.saunevibe.fresh | grep -E '^[0-9]+'
            echo "Android 11 fresh install and launch smoke test passed."
      - name: Upload APK verification reports
        uses: actions/upload-artifact@v4
        with:
          name: SAUNE_VIBE_FRESH_v1.1.1_VERIFICATION
          path: |
            apk-signature-verification.txt
            apk-package-info.txt
            apk-sha256.txt
          if-no-files-found: error
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAUNE_VIBE_FRESH_v1.1.1_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download in GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Saune_Vibe_Fresh_Install_v1.1.1.apk
          test -s Saune_Vibe_Fresh_Install_v1.1.1.apk
          if gh release view v1.1.1 > /dev/null 2>&1; then
            gh release upload v1.1.1 Saune_Vibe_Fresh_Install_v1.1.1.apk --clobber
          else
            gh release create v1.1.1 Saune_Vibe_Fresh_Install_v1.1.1.apk \
              --title "Saune Vibe 1.1.1 - Fresh Install APK" \
              --notes "Download the debug-signed Android APK below (Android 7.0+). Fresh-install compatibility edition. Separate application ID com.saunevibe.fresh avoids signature conflicts with previous debug APKs. Your old installation remains untouched; its private data is not copied. Includes Audius, optional Jamendo, Wikimedia Commons, offline MP3 and official YouTube embed. Test build; use a persistent signing key for future upgrades." \
              --target "$GITHUB_SHA"
          fi
