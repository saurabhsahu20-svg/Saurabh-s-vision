plugins { id 'com.android.application' }
android {
 namespace 'com.visionone.scanner'
 compileSdk 35
 defaultConfig { applicationId 'com.visionone.scanner'; minSdk 26; targetSdk 32; versionCode 4; versionName '2.0-scan-pdf-beta'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 def v = '1.4.2'
 implementation "androidx.camera:camera-camera2:$v"
 implementation "androidx.camera:camera-lifecycle:$v"
 implementation "androidx.camera:camera-view:$v"
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.core:core:1.16.0'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 implementation 'org.opencv:opencv:4.12.0'
}
