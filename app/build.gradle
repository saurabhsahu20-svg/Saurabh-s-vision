plugins { id 'com.android.application' }
android {
 namespace 'com.visionone.scanner'
 compileSdk 35
 defaultConfig { applicationId 'com.visionone.scanner'; minSdk 26; targetSdk 32; versionCode 3; versionName '1.2-beta' }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 def v = '1.4.2'
 implementation "androidx.camera:camera-camera2:$v"
 implementation "androidx.camera:camera-lifecycle:$v"
 implementation "androidx.camera:camera-view:$v"
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.core:core:1.16.0'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 implementation 'org.opencv:opencv:4.12.0'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
}
